<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room: Apagón BlackOhm · U5 Electricidad · TyD 2º ESO</title>
<meta name="description" content="Escape room educativo de electricidad para 2º ESO con ambientación de ciberseguridad y retos de lógica. 30-45 min.">
<style>
  /* ============ BASE ============ */
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg-0:#05080f;
    --bg-1:#0c1424;
    --bg-2:#172238;
    --neon:#39ff14;
    --neon-soft:#7cff5e;
    --cyan:#00e5ff;
    --amber:#ffb300;
    --warn:#ff9100;
    --bad:#ff3860;
    --good:#27e08d;
    --ink:#e6f1ff;
    --ink-dim:#9fb3c8;
    --ink-faint:#6a7a90;
    --line:rgba(0,229,255,0.18);
    --line-strong:rgba(0,229,255,0.45);
    --grid: rgba(0, 229, 255, 0.07);
  }
  html,body{height:100%}
  body{
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(ellipse at top, rgba(0,229,255,0.10) 0%, transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(57,255,20,0.06) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.55;
  }
  /* sutil rejilla cyber */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  .container{
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 18px 60px;
    position: relative;
    z-index: 1;
  }

  /* ============ HEADER ============ */
  header.top{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
    padding: 10px 16px;
    background: linear-gradient(90deg, rgba(0,229,255,0.06), rgba(57,255,20,0.04));
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: 0 0 30px rgba(0,229,255,0.05) inset;
  }
  .brand{
    font-family: 'Courier New', monospace;
    font-size: 1.05rem;
    color: var(--neon);
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(57,255,20,0.5);
  }
  .brand .tag{ color: var(--cyan); }
  .brand .blink{ animation: blink 1.2s steps(2) infinite; }
  @keyframes blink{ 50%{opacity:0.2} }

  .meta{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .timer{
    font-family: 'Courier New', monospace;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    letter-spacing: 2px;
    box-shadow: 0 0 14px rgba(0,229,255,0.25);
    min-width: 95px;
    text-align:center;
  }
  .timer.warn{ color: var(--warn); border-color: var(--warn); box-shadow: 0 0 14px rgba(255,145,0,0.4); }
  .timer.danger{ color: var(--bad); border-color: var(--bad); box-shadow: 0 0 18px rgba(255,56,96,0.5); animation: pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:0.5} }

  .score-pill{
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(57,255,20,0.08);
    border: 1px solid rgba(57,255,20,0.4);
    color: var(--neon);
  }

  /* ============ PROGRESS DOTS ============ */
  .progress{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    margin-bottom: 18px;
  }
  .step{
    width: 34px; height: 34px; border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 0.85rem;
    font-family: 'Courier New', monospace;
    border: 1.5px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04);
    color: var(--ink-faint);
    transition: all 0.3s;
  }
  .step.active{
    border-color: var(--amber); color: var(--amber);
    box-shadow: 0 0 12px rgba(255,179,0,0.5);
  }
  .step.done{
    background: rgba(39,224,141,0.25);
    border-color: var(--good); color: var(--good);
  }

  /* ============ PANEL ============ */
  .panel{
    background: linear-gradient(180deg, rgba(23,34,56,0.85), rgba(12,20,36,0.85));
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    padding: 28px 24px;
    backdrop-filter: blur(8px);
    box-shadow:
      0 10px 40px rgba(0,0,0,0.45),
      0 0 50px rgba(0,229,255,0.06) inset;
    animation: fadeIn 0.5s ease-out;
    position: relative;
    overflow: hidden;
  }
  .panel::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--neon), var(--cyan), var(--amber));
    opacity: 0.6;
  }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(15px);} to{opacity:1; transform: translateY(0);} }

  h1{ font-size: 1.55rem; margin-bottom: 12px; color: var(--neon); text-shadow: 0 0 8px rgba(57,255,20,0.3); letter-spacing: 0.5px; }
  h2{ font-size: 1.3rem; margin-bottom: 12px; color: var(--cyan); }
  .subtitle{
    font-family: 'Courier New', monospace;
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  p{ margin-bottom: 12px; color: var(--ink); }
  .narrativa{
    background: rgba(0,0,0,0.35);
    padding: 14px 16px;
    border-left: 3px solid var(--neon);
    border-radius: 6px;
    margin: 14px 0 18px;
    font-style: italic;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .narrativa strong{ color: var(--neon); font-style: normal; }
  .narrativa .red{ color: var(--bad); font-style: normal; font-weight: bold; }

  .question{
    background: rgba(255,179,0,0.08);
    border: 1px solid rgba(255,179,0,0.4);
    padding: 14px 16px;
    border-radius: 10px;
    margin: 16px 0;
    color: #ffe9b0;
    font-size: 1.02rem;
  }
  .question strong{ color: var(--amber); }
  .visual{
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    padding: 16px;
    margin: 14px 0;
    text-align:center;
    border: 1px dashed rgba(0,229,255,0.3);
  }

  /* ============ OPCIONES ============ */
  .options{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .option{
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.12);
    padding: 14px 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align:center;
    transition: all 0.18s;
    font-size: 0.98rem;
    color: var(--ink);
    user-select: none;
  }
  .option:hover{
    border-color: var(--cyan);
    background: rgba(0,229,255,0.10);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,229,255,0.18);
  }
  .option.selected{
    border-color: var(--amber);
    background: rgba(255,179,0,0.15);
    color: var(--amber);
  }
  .option svg{ display:block; margin: 0 auto 6px; }

  /* ============ CHECKBOXES ============ */
  .check-row{
    display:flex; align-items:center; gap:12px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.18s;
  }
  .check-row:hover{ background: rgba(255,255,255,0.08); border-color: var(--line-strong); }
  .check-row input{ width: 20px; height: 20px; accent-color: var(--neon); cursor: pointer; }

  /* ============ INPUT ============ */
  .text-input{
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.35);
    border: 2px solid var(--line-strong);
    border-radius: 10px;
    color: var(--ink);
    font-size: 1.05rem;
    font-family: 'Courier New', monospace;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
  }
  .text-input:focus{
    border-color: var(--neon);
    box-shadow: 0 0 14px rgba(57,255,20,0.25);
  }

  /* ============ BOTONES ============ */
  .actions{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-top: 14px;
  }
  .btn{
    background: linear-gradient(135deg, var(--neon), var(--good));
    color: #0a0f1f;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 0.98rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 4px 14px rgba(57,255,20,0.3);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(57,255,20,0.5); }
  .btn:disabled{ opacity: 0.5; cursor: not-allowed; }
  .btn-secondary{
    background: rgba(0,229,255,0.12);
    color: var(--cyan);
    border: 1px solid var(--cyan);
    box-shadow: none;
  }
  .btn-secondary:hover{ background: rgba(0,229,255,0.2); box-shadow: 0 4px 14px rgba(0,229,255,0.2); }
  .btn-danger{
    background: linear-gradient(135deg, var(--bad), #b71540);
    color: white;
    box-shadow: 0 4px 14px rgba(255,56,96,0.3);
  }
  .attempts{
    margin-left:auto;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
    color: var(--ink-faint);
  }

  /* ============ FEEDBACK ============ */
  .feedback{
    padding: 14px 16px;
    border-radius: 10px;
    margin-top: 14px;
    font-weight: 600;
    animation: fadeIn 0.3s;
    border: 1px solid;
  }
  .feedback.ok{
    background: rgba(39,224,141,0.12);
    border-color: var(--good);
    color: #b4f5d0;
  }
  .feedback.err{
    background: rgba(255,56,96,0.12);
    border-color: var(--bad);
    color: #ffc4cf;
  }
  .feedback.hint{
    background: rgba(0,229,255,0.1);
    border-color: var(--cyan);
    color: #cdf2ff;
    font-style: italic;
    font-weight: 500;
  }

  /* ============ TERMINAL ============ */
  .terminal{
    background: #02060b;
    border: 1px solid rgba(57,255,20,0.4);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Courier New', monospace;
    font-size: 0.92rem;
    color: var(--neon);
    margin: 12px 0;
    line-height: 1.6;
    box-shadow: 0 0 20px rgba(57,255,20,0.1) inset;
  }
  .terminal .prompt{ color: var(--cyan); }
  .terminal .warn{ color: var(--warn); }
  .terminal .bad{ color: var(--bad); }

  /* ============ EMAIL UI ============ */
  .email{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 12px 0;
    font-size: 0.95rem;
  }
  .email .from{
    color: var(--ink-faint);
    font-size: 0.85rem;
    margin-bottom: 4px;
    font-family: 'Courier New', monospace;
  }
  .email .from b{ color: var(--ink); }
  .email .subject{
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .email .body{ color: var(--ink-dim); }
  .email .link{
    display:inline-block;
    background: rgba(0,229,255,0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 6px 12px;
    border-radius: 6px;
    margin-top: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    word-break: break-all;
  }

  /* ============ INTERRUPTORES BINARIOS ============ */
  .switches{
    display:flex; justify-content:center; gap: 18px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .switch-box{
    text-align:center;
    user-select:none;
  }
  .switch-box .label{
    font-family: 'Courier New', monospace;
    color: var(--ink-dim);
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .switch{
    width: 70px; height: 100px;
    background: linear-gradient(180deg, #1a2230, #0f1620);
    border: 2px solid #2a3548;
    border-radius: 10px;
    position:relative;
    cursor:pointer;
    transition: all 0.2s;
  }
  .switch:hover{ border-color: var(--cyan); }
  .switch .lever{
    position:absolute;
    left: 14px; right: 14px;
    height: 36px;
    background: linear-gradient(180deg, #e0e6ee, #98a4b8);
    border-radius: 6px;
    transition: top 0.25s cubic-bezier(.5,-0.2,.5,1.2);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    top: 56px; /* OFF */
  }
  .switch.on .lever{
    top: 8px;
    background: linear-gradient(180deg, var(--neon), var(--good));
    box-shadow: 0 3px 12px rgba(57,255,20,0.6);
  }
  .switch .state{
    position:absolute;
    bottom: -22px; left: 0; right: 0;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    color: var(--ink-faint);
    font-size: 0.9rem;
  }
  .switch.on .state{ color: var(--neon); }

  .bulb-area{
    margin: 24px auto 8px;
    text-align:center;
  }

  /* ============ FINAL ============ */
  .victory{ text-align:center; padding: 30px 16px; }
  .victory h1{
    font-size: 2.2rem;
    background: linear-gradient(90deg, var(--neon), var(--cyan), var(--amber));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine{ to{ background-position: 200% center; } }
  .stats{
    display:flex; justify-content:center; gap: 14px; flex-wrap:wrap;
    margin: 22px 0;
  }
  .stat{
    background: rgba(0,0,0,0.4);
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    min-width: 110px;
  }
  .stat .num{ font-size: 1.6rem; font-weight: 700; color: var(--neon); font-family: 'Courier New', monospace; }
  .stat .lbl{ font-size: 0.78rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }

  footer{
    text-align:center;
    margin-top: 22px;
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-family: 'Courier New', monospace;
  }

  .badge-row{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    margin: 12px 0;
  }
  .badge{
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid;
  }
  .badge-cyber{ border-color: var(--cyan); color: var(--cyan); }
  .badge-elec{ border-color: var(--amber); color: var(--amber); }
  .badge-logic{ border-color: var(--neon); color: var(--neon); }

  .hidden{ display:none; }

  @media (max-width: 560px){
    h1{ font-size: 1.25rem; }
    .panel{ padding: 20px 16px; }
    .timer{ font-size: 1rem; padding: 4px 10px; }
    .switch{ width: 56px; height: 88px; }
    .switch .lever{ left:10px; right:10px; height: 30px; top: 50px; }
    .switch.on .lever{ top: 8px; }
  }
</style>
</head>

const $ = id => document.getElementById(id);
const screen = $('screen');

retos.forEach(() => {
  state.attempts.push(0);
  state.hintsUsed.push(0);
  state.done.push(false);
});

function renderProgress(){
  $('progress').innerHTML = retos.map((r, i) => {
    const cls = state.done[i] ? 'done' : (i === state.current ? 'active' : '');
    return `<div class="step ${cls}" title="${r.titulo}">${state.done[i] ? '✓' : (i+1)}</div>`;
  }).join('');
}

function updateScore(){
  $('scorePill').textContent = `PTS: ${state.score}`;
}

function renderReto(i){
  const r = retos[i];
  state.optSelected = null;
  state.switches = [false, false, false];

  let cuerpo = '';

  if(r.tipo === 'opciones'){
    cuerpo = `<div class="options" id="opts">${r.opciones.map((o, idx) =>
      `<div class="option" data-i="${idx}" onclick="selectOpt(${idx})">${o}</div>`
    ).join('')}</div>`;
  } else if(r.tipo === 'checkboxes'){
    cuerpo = `<div id="checks">${r.items.map((it, idx) =>
      `<label class="check-row"><input type="checkbox" data-i="${idx}"><span>${it.nombre}</span></label>`
    ).join('')}</div>`;
  } else if(r.tipo === 'numero'){
    cuerpo = `<input type="number" step="any" class="text-input" id="ans" placeholder="Introduce el valor (${r.unidad})">`;
  } else if(r.tipo === 'texto'){
    cuerpo = `<input type="text" class="text-input" id="ans" placeholder="Escribe tu respuesta...">`;
  } else if(r.tipo === 'custom' && r.customRender === 'switches'){
    cuerpo = renderSwitches();
  }

  screen.innerHTML = `
    <div class="panel">
      <div class="subtitle"><span class="badge ${r.badgeClass}">${r.tag}</span> &nbsp; ${i+1} / ${retos.length}</div>
      <h2>${r.titulo}</h2>
      <div class="narrativa">${r.narrativa}</div>
      ${r.terminal ? `<div class="terminal">${r.terminal}</div>` : ''}
      ${r.visual ? `<div class="visual">${r.visual}</div>` : ''}
      <div class="question">${r.pregunta}</div>
      ${cuerpo}
      <div class="actions">
        <button class="btn" onclick="comprobar()">✓ Comprobar</button>
        <button class="btn btn-secondary" onclick="pedirPista()" id="hintBtn">💡 Pista (${r.pistas.length - state.hintsUsed[i]})</button>
        <span class="attempts">Intentos: ${state.attempts[i]} · ${r.puntos} pts máx</span>
      </div>
      <div id="feedback"></div>
    </div>
  `;
  renderProgress();
}

function renderSwitches(){
  return `
    <div class="bulb-area" id="bulbArea">${bulbSVG(false)}</div>
    <div class="switches" id="switches">
      ${[0,1,2].map(i => `
        <div class="switch-box">
          <div class="label">SW${i+1}</div>
          <div class="switch ${state.switches[i] ? 'on' : ''}" onclick="toggleSwitch(${i})">
            <div class="lever"></div>
            <div class="state">${state.switches[i] ? '1 / ON' : '0 / OFF'}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function bulbSVG(on){
  const color = on ? '#ffe14a' : '#3a4458';
  const glow = on ? `<circle cx="60" cy="40" r="48" fill="${color}" opacity="0.25"/>` : '';
  return `
    <svg viewBox="0 0 120 110" width="120" height="110">
      ${glow}
      <path d="M40 70 Q40 30 60 20 Q80 30 80 70 Z" fill="${color}" stroke="#00e5ff" stroke-width="2"/>
      <rect x="48" y="68" width="24" height="12" fill="#0c1424" stroke="#00e5ff" stroke-width="2"/>
      <line x1="52" y1="84" x2="68" y2="84" stroke="#00e5ff" stroke-width="2"/>
      <line x1="54" y1="92" x2="66" y2="92" stroke="#00e5ff" stroke-width="2"/>
      <text x="60" y="105" fill="${on?'#39ff14':'#6a7a90'}" font-family="monospace" font-size="11" text-anchor="middle">${on?'ENCENDIDA':'APAGADA'}</text>
    </svg>
  `;
}

function toggleSwitch(i){
  state.switches[i] = !state.switches[i];
  // re-render switches + bulb
  const allOn = state.switches.every(s => s);
  $('bulbArea').innerHTML = bulbSVG(allOn);
  const sw = document.querySelectorAll('#switches .switch');
  sw[i].classList.toggle('on', state.switches[i]);
  sw[i].querySelector('.state').textContent = state.switches[i] ? '1 / ON' : '0 / OFF';
}

function selectOpt(i){
  state.optSelected = i;
  document.querySelectorAll('#opts .option').forEach((el, idx) =>
    el.classList.toggle('selected', idx === i)
  );
}

function pedirPista(){
  const i = state.current;
  const r = retos[i];
  if(state.hintsUsed[i] >= r.pistas.length){
    mostrarFeedback('hint', 'Ya no quedan más pistas. ¡Tú puedes con esto!');
    return;
  }
  const p = r.pistas[state.hintsUsed[i]];
  state.hintsUsed[i]++;
  mostrarFeedback('hint', `💡 Pista ${state.hintsUsed[i]}: ${p}`);
  $('hintBtn').textContent = `💡 Pista (${r.pistas.length - state.hintsUsed[i]})`;
}

function mostrarFeedback(tipo, msg){
  $('feedback').innerHTML = `<div class="feedback ${tipo}">${msg}</div>`;
}

function quitarAcentos(s){
  return s.normalize('NFD').replace(/\p{Diacritic}/gu, '');
}

function comprobar(){
  const i = state.current;
  const r = retos[i];
  state.attempts[i]++;
  let correcto = false;

  if(r.tipo === 'opciones'){
    if(state.optSelected === null){
      mostrarFeedback('err', '⚠ Selecciona una opción primero.');
      state.attempts[i]--; return;
    }
    correcto = (state.optSelected === r.correcta);
  } else if(r.tipo === 'checkboxes'){
    const inputs = document.querySelectorAll('#checks input');
    correcto = Array.from(inputs).every((inp, idx) =>
      inp.checked === r.items[idx].conductor
    );
  } else if(r.tipo === 'numero'){
    const v = parseFloat($('ans').value.replace(',','.'));
    if(isNaN(v)){
      mostrarFeedback('err', '⚠ Introduce un número.');
      state.attempts[i]--; return;
    }
    correcto = Math.abs(v - r.correcta) <= r.tolerancia;
  } else if(r.tipo === 'texto'){
    const raw = $('ans').value.trim();
    if(!raw){
      mostrarFeedback('err', '⚠ Escribe una respuesta.');
      state.attempts[i]--; return;
    }
    const v = quitarAcentos(raw.toLowerCase());
    const validas = r.respuestasValidas.map(x => quitarAcentos(x.toLowerCase()));
    correcto = validas.some(x => v === x || (v.includes(x) && v.length < x.length + 15));
  } else if(r.tipo === 'custom' && r.customRender === 'switches'){
    correcto = state.switches.every(s => s); // todos ON = serie cerrado
  }

  // actualiza intentos
  const att = document.querySelector('.attempts');
  if(att) att.textContent = `Intentos: ${state.attempts[i]} · ${r.puntos} pts máx`;

  if(correcto){
    state.done[i] = true;
    // puntos: máx - 2 por intento extra - 2 por pista
    const extra = Math.max(0, state.attempts[i] - 1);
    const pts = Math.max(0, r.puntos - extra*2 - state.hintsUsed[i]*2);
    state.score += pts;
    updateScore();
    mostrarFeedback('ok', `${r.explicacion}<br><br><strong>+${pts} pts</strong> (intentos: ${state.attempts[i]}, pistas: ${state.hintsUsed[i]})`);
    // reemplazar botones
    document.querySelector('.actions').innerHTML = (state.current === retos.length - 1)
      ? `<button class="btn" onclick="finalizar()">🏆 Reactivar el sistema</button>`
      : `<button class="btn" onclick="siguiente()">▶ Siguiente reto</button>`;
    renderProgress();
  } else {
    let msg = '❌ No es correcto. Revisa tu respuesta o pide una pista.';
    if(r.tipo === 'checkboxes'){
      const inputs = document.querySelectorAll('#checks input');
      let aciertos = 0;
      inputs.forEach((inp, idx) => {
        if(inp.checked === r.items[idx].conductor) aciertos++;
      });
      msg = `❌ No del todo. Tienes ${aciertos} de ${r.items.length} correctos. Revisa cuáles son metales.`;
    }
    mostrarFeedback('err', msg);
  }
}

function empezar(){
  state.current = 0;
  state.startTime = Date.now();
  iniciarTimer();
  renderReto(0);
}

function siguiente(){
  state.current++;
  renderReto(state.current);
}

function iniciarTimer(){
  clearInterval(state.timerInterval);
  actualizarTimer();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    actualizarTimer();
    if(state.timeLeft <= 0){
      clearInterval(state.timerInterval);
      tiempoAgotado();
    }
  }, 1000);
}

function actualizarTimer(){
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  const t = $('timer');
  t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  t.classList.remove('warn','danger');
  if(state.timeLeft <= 60) t.classList.add('danger');
  else if(state.timeLeft <= 5*60) t.classList.add('warn');
}

function tiempoAgotado(){
  const completados = state.done.filter(x => x).length;
  screen.innerHTML = `
    <div class="panel victory">
      <h1 style="-webkit-text-fill-color:#ff3860; color:#ff3860; background:none; animation:none;">⏰ TIEMPO AGOTADO</h1>
      <div class="terminal" style="text-align:left;">
        <span class="bad">[CRITICAL]</span> Batería de emergencia agotada<br>
        <span class="warn">[INFO]</span> Retos completados: ${completados} / ${retos.length}<br>
        <span class="warn">[INFO]</span> Puntuación parcial: ${state.score} pts<br>
        <span class="prompt">></span> No pasa nada: el aprendizaje es lo importante.
      </div>
      <button class="btn" onclick="location.reload()">↻ Reiniciar misión</button>
    </div>
  `;
}

function finalizar(){
  clearInterval(state.timerInterval);
  const used = (TOTAL_MIN*60) - state.timeLeft;
  const m = Math.floor(used / 60);
  const s = used % 60;
  const totalAtt = state.attempts.reduce((a,b) => a+b, 0);
  const totalHints = state.hintsUsed.reduce((a,b) => a+b, 0);
  const maxScore = retos.reduce((a,r) => a+r.puntos, 0);
  const pct = Math.round((state.score / maxScore) * 100);

  let medalla = '🥇 Oro · ¡Eres un crack!';
  if(pct < 90) medalla = '🥈 Plata · Muy bien';
  if(pct < 70) medalla = '🥉 Bronce · Bien hecho';
  if(pct < 50) medalla = '🎖️ Participación · A repasar';

  screen.innerHTML = `
    <div class="panel victory">
      <h1>⚡ SUMINISTRO RESTAURADO</h1>
      <div class="terminal" style="text-align:left;">
        <span class="ok" style="color:#27e08d">[OK]</span> Acceso al sistema: <strong>RECUPERADO</strong><br>
        <span class="ok" style="color:#27e08d">[OK]</span> Suministro eléctrico: <strong>ONLINE</strong><br>
        <span class="ok" style="color:#27e08d">[OK]</span> BlackOhm expulsado del sistema<br>
        <span class="prompt">></span> El Profesor Voltio te da las gracias 🙏
      </div>

      <div class="stats">
        <div class="stat"><div class="num">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class="lbl">Tiempo</div></div>
        <div class="stat"><div class="num">${state.score}/${maxScore}</div><div class="lbl">Puntos</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">Rendimiento</div></div>
        <div class="stat"><div class="num">${totalHints}</div><div class="lbl">Pistas usadas</div></div>
        <div class="stat"><div class="num">${totalAtt}</div><div class="lbl">Intentos</div></div>
      </div>

      <p style="font-size:1.05rem; color:var(--amber); margin: 14px 0;">${medalla}</p>

      <div style="text-align:left; background:rgba(0,0,0,0.3); padding:14px 16px; border-radius:10px; margin:18px 0; font-size:0.9rem; color:var(--ink-dim);">
        <strong style="color:var(--neon)">Has repasado:</strong><br>
        ⚡ Símbolos eléctricos · Conductores y aislantes · Ley de Ohm (V=I·R) · Circuitos en serie y paralelo · Cuadro general de mando y protección · Seguridad eléctrica<br>
        🔒 Contraseñas seguras · Phishing y dominios sospechosos<br>
        🧮 Lógica binaria (0/1) y su conexión con la electricidad
      </div>

      <button class="btn" onclick="location.reload()">↻ Volver a jugar</button>
    </div>
  `;
  renderProgress();
}

// ============================================================
//  ARRANQUE
// ============================================================
renderIntro();
</script>
